<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Explorer | Your Favorites</title>
    <meta
      name="description"
      content="View and manage your saved favorite music tracks."
    />
    <meta name="author" content="Lionel Alvarado" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <script type="module" src="./src/js/favorites.js"></script>
  </head>

  <body>
    <header id="main-header">
      <div class="logo-container">
        <h1>Music Explorer</h1>
      </div>
      <button id="menu-button">&#9776;</button>
      <nav id="primary-nav">
        <a href="index.html">Search</a>
        <a href="favorites.html" class="active">Favorites</a>
      </nav>
    </header>

    <main>
      <section class="results-section">
        <h2>Your Favorite Tracks</h2>
        <div id="favorites-grid" class="music-grid">
          <!-- Favorites rendered dynamically -->
        </div>
      </section>

      <!-- Modal Dialog -->
      <dialog id="details-modal">
        <div class="modal-content">
          <button id="close-modal">&times;</button>
          <div id="modal-details-body">
            <!-- Dynamic Details Rendered Here -->
          </div>
        </div>
      </dialog>
    </main>

    <footer id="main-footer">
      <p>
        &copy; <span id="currentYear"></span> Music Explorer | Lionel Alvarado
      </p>
      <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
  </body>
</html>
