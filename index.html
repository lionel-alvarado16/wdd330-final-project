<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Explorer | Find Your Favorite Tracks</title>
    <meta
      name="description"
      content="Search for music artists, explore top tracks, listen to audio previews, and save your favorite songs."
    />
    <meta name="author" content="Lionel Alvarado" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <script type="module" src="./src/js/main.js"></script>
  </head>
  <body>
    <header id="main-header"></header>

    <main>
      <!-- Search Section -->
      <section class="search-section">
        <form id="search-form">
          <input
            type="search"
            id="search-input"
            placeholder="Search artist or song..."
            required
          />
          <button type="submit">Search</button>
        </form>
      </section>

      <!-- Results Grid Container -->
      <section class="results-section">
        <h2>Results</h2>
        <div id="music-grid" class="music-grid">
          <!-- Dynamic Content Rendered Here -->
        </div>
      </section>

      <!-- Modal Dialog-->
      <dialog id="details-modal">
        <div class="modal-content">
          <button id="close-modal">&times;</button>
          <div id="modal-details-body">
            <!-- Dynamic Details Rendered Here -->
          </div>
        </div>
      </dialog>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
